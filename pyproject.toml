[project]
name = "el-nino-atlas"
version = "0.2.0"
description = "Open-source interactive tracker linking the 2026-27 El Niño to realised socioeconomic impacts: forecast, anticipatory action, realised impact."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alaa Al Khourdajie" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "dash>=4.4.1",
    "plotly>=7.0.0",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "gunicorn>=26.2.0",
    "requests>=2.34.2",
    "openpyxl>=3.1.5",
    "pycountry>=26.2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package is literally named ``src`` (``from src import theme``);
# hatch maps the directory to a top-level package of the same name. Non-Python
# files inside it (sources.yaml) are included with the package.
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "app.py", "config.py", "run.py", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
