    terms_url: http://www.weather.gov/disclaimer.php
    deep_url: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/impacts/warm.gif
    redistribution: "yes"
    attribution: "Source: NOAA Climate Prediction Center, typical El Niño temperature and precipitation patterns"
    cadence: static; the image carries a Last-Modified date of 7 November 2012
    status: approved
    reason: NOAA CPC typical El Niño impacts schematic, US government work
    notes: >-
      Context layer: the CPC schematic of typical El Niño temperature and
      precipitation patterns, shown or linked as an image. No fetcher and
      no snapshot. Both URLs answered 200 on 2026-09-07; the image is
      image/gif, 143255 bytes, and is embedded in the page. terms_url is
      the NWS disclaimer linked from the page footer, not fetched in
      session A because the host is outside the permitted list.

