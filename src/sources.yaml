# Licence registry for the El Niño Atlas.
#
# This file gates all data work. No fetcher may exist for a source unless
# its status here is `approved` or `conditional` (tests/test_sources_gate.py).
# `excluded` sources are never reintroduced in any form. `superseded`
# sources are editorial choices (a better source covers the same ground)
# and behave as excluded for the fetcher gate. `link-only` sources may be
# cited and linked from the tool but never fetched or redistributed.
# `pending` sources are blocked until the licence check is resolved and
# the status is changed here.
#
# Fields
#   id             stable snake_case key; a fetcher module must use the same name
#   name           human-readable dataset name
#   publisher      responsible organisation
#   url            canonical landing page
#   licence        licence as stated by the publisher, or "unverified"
#   licence_id     SPDX identifier where one exists (CC-BY-4.0); a LicenseRef-
#                  identifier for stated custom terms (LicenseRef-US-PD for US
#                  government work); null while the licence is unverified.
#                  src/schema.validate_frame requires every frame's licence_id
#                  to equal this value for its source_id.
#   terms_url      the publisher's terms page where it was fetched and read;
#                  null otherwise, with the page to verify named in notes
#   deep_url       exact file URL(s) fetched, or the durable page from which
#                  the current file link is resolved at run time; null when
#                  nothing is fetched
#   series         series carried into the tidy contract (data sources only)
#   redistribution yes | conditional | no
#   attribution    string to render wherever the data appears
#   cadence        publication frequency and revision behaviour
#   status         approved | conditional | link-only | excluded | superseded | pending
#   reason         one line of plain text stating why the status holds
#   notes          caveats, verification tasks, decision rationale

sources:
  # ---------------------------------------------------------------- approved
  - id: noaa_oni
    name: Oceanic Niño Index (ONI) and Relative Oceanic Niño Index (RONI)
    publisher: NOAA Climate Prediction Center
    url: https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/oni/v6/
    licence: US Government work, public domain
    licence_id: LicenseRef-US-PD
    terms_url: https://weather.gov/disclaimer.php
    deep_url:
      - https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt
      - https://www.cpc.ncep.noaa.gov/data/indices/RONI.ascii.txt
    series: [ONI, RONI]
    redistribution: "yes"
    attribution: "Source: NOAA Climate Prediction Center, Oceanic Niño Index (ONI) and Relative Oceanic Niño Index (RONI)"
    cadence: >-
      monthly; the CPC table pages state they are updated by the 5th of
      each month; values may change for up to two months after first
      posting, so the latest seasons are estimates
    status: approved
    reason: US federal government work in the public domain.
    notes: >-
      Forecast-stage ENSO indicators. Both files carry the ERSSTv6 series:
      rounded to one decimal they match the CPC table at the url above
      (ONI) and the RONI table at
      https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/,
      and not the ERSSTv5 tables. Per NWS Public Information Statement
      26-05 the RONI is CPC's official index for ENSO monitoring and
      prediction. The earlier landing page ONI_v5.php now points to the v6
      table. Attribution is customary rather than required; terms_url is
      the NWS disclaimer linked from the CPC page footers, not fetched in
      session A because the host is outside the permitted list. Snapshots
      are committed under data/snapshots/noaa_oni/.

  - id: worldbank_pink_sheet
    name: Commodity Price Data (the Pink Sheet)
    publisher: World Bank, Prospects Group
    url: https://www.worldbank.org/en/research/commodity-markets
    licence: CC BY 4.0
    licence_id: CC-BY-4.0
    terms_url: https://www.worldbank.org/ext/en/legal/terms-conditions/datasets
    deep_url: https://www.worldbank.org/en/research/commodity-markets
    series:
      - code: COFFEE_ARABIC
        name: Coffee, Arabica
        unit: "$/kg"
      - code: COFFEE_ROBUS
        name: Coffee, Robusta
        unit: "$/kg"
      - code: COCOA
        name: Cocoa
        unit: "$/kg"
      - code: SUGAR_WLD
        name: Sugar, world
        unit: "$/kg"
      - code: RICE_05
        name: Rice, Thai 5%
        unit: "$/mt"
    redistribution: "yes"
    attribution: "The World Bank: Commodity Price Data (The Pink Sheet): World Bank Prospects Group"
    cadence: >-
      monthly, published in the first week of the month with data to the
      end of the previous month
    status: approved
    reason: Published under CC BY 4.0 with attribution required.
    notes: >-
      Realised-impact stage, commodity prices. Supersedes IMF PCPS for this
      tool. The monthly workbook CMO-Historical-Data-Monthly.xlsx is linked
      from the durable page with a path segment that rotates per release,
      so the fetcher resolves the current link on every run. The workbook
      lists series by name and unit only (rows 5 and 6 of the sheet
      Monthly Prices; names are matched after stripping whitespace); the
      codes above are the World Bank series codes carried as series ids.
      Terms fetched and read on 2026-09-07: CC BY 4.0 with the attribution
      format "The World Bank: Dataset name: Data source (if known)", a
      mandatory dispute resolution clause and third-party data exceptions.
      Snapshots are committed under data/snapshots/worldbank_pink_sheet/.

