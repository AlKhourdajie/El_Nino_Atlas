# Fast local hooks: lint plus the two gate suites. The full test suite
# runs in CI. Install with `uv run pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: gate-tests
        name: sources-gate and schema tests
        entry: uv run pytest -q tests/test_sources_gate.py tests/test_schema.py
        language: system
        pass_filenames: false
        always_run: true
